# ═══════════════════════════════════════════════════════════════
# NetBypass Java Service — Application Properties
# ═══════════════════════════════════════════════════════════════

# Server
server.port=${PORT:8080}

# ───────────────────────────────────────────────────────────────
# Supabase PostgreSQL via JDBC
# Set these as environment variables in Railway / Render:
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# ───────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# ───────────────────────────────────────────────────────────────
# JPA / Hibernate
# ───────────────────────────────────────────────────────────────
# validate: checks schema without modifying it (safe for production)
# update:   auto-creates / alters tables (OK for Railway first-run)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ───────────────────────────────────────────────────────────────
# CORS
# Set to your actual Vercel URL in production, e.g.:
#   APP_CORS_ALLOWED_ORIGINS=https://netbypass.vercel.app
# ───────────────────────────────────────────────────────────────
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# ───────────────────────────────────────────────────────────────
# Jackson — serialize OffsetDateTime as ISO 8601 strings
# ───────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ───────────────────────────────────────────────────────────────
# Logging
# ───────────────────────────────────────────────────────────────
logging.level.com.netbypass=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
